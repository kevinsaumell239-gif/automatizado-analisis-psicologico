name: Compilar Cronología Fidel Castro

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Crear plataforma Android
        run: flutter create --platforms=android .

      - name: Configurar permisos e intents en AndroidManifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET" \/>' "$MANIFEST"
          fi
          if ! grep -q "<queries>" "$MANIFEST"; then
            sed -i '/<\/manifest>/i \    <queries>\n        <intent>\n            <action android:name="android.intent.action.VIEW" \/>\n            <data android:scheme="https" \/>\n        <\/intent>\n    <\/queries>' "$MANIFEST"
          fi

      - name: Eliminar prueba automática
        run: rm -f test/widget_test.dart

      - name: Verificar archivos necesarios
        run: |
          test -f pubspec.yaml
          test -f lib/main.dart
          test -f assets/data/cronologia.json
          test -f assets/images/icon.png

      - name: Instalar dependencias
        run: flutter pub get

      - name: Generar iconos de Android
        run: dart run flutter_launcher_icons

      - name: Compilar APK de producción
        run: flutter build apk --release

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: cronologia-fidel-castro-apk
          path: build/app/outputs/flutter-apk/app-release.apk
