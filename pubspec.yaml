name: cronologia_fidel_castro

description: Aplicación educativa con una cronología documentada de la vida y trayectoria histórica de Fidel Castro Ruz entre 1926 y 2016.

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/cronologia.json
    - assets/images/
    - assets/portraits/
